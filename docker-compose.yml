version: '3.8'

services:
  app:
    build: .
    container_name: osonish-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/osonish_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0LXRva2Vucy1vc29uaXNoLXBsYXRmb3Jt}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - osonish-net
    volumes:
      - file-uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: osonish-db
    environment:
      - POSTGRES_DB=osonish_db
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    networks:
      - osonish-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d osonish_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: osonish-redis
    ports:
      - "6379:6379"
    networks:
      - osonish-net
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  osonish-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  file-uploads:
